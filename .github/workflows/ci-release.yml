name: CI, Test & Multi-Arch HA Add-on Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "farm-waitlist/CHANGELOG.md"
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, Unit, UI & Ingress E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        run: npm run lint

      - name: Backend unit & SQLite tests
        run: npm run test:backend

      - name: Frontend component & interaction tests
        run: npm run test:frontend

      - name: Build production bundle
        run: npm run build

      - name: Playwright Home Assistant Ingress E2E tests
        run: npm run test:e2e

  changelog-and-release:
    name: Build Multi-Arch HA Images, Release & Update CHANGELOG
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve target release version (read-only)
        id: version
        run: |
          VERSION=$(node scripts/release-changelog.mjs --auto-bump --resolve-version)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for aarch64 emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aarch64 image (Home Assistant Yellow)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: farm-waitlist/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/farm-waitlist-aarch64:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/farm-waitlist-aarch64:latest

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: farm-waitlist/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/farm-waitlist-amd64:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/farm-waitlist-amd64:latest

      - name: Update changelogs & bump version (after all builds pass)
        run: |
          node scripts/release-changelog.mjs --auto-bump --notes-out /tmp/release-notes.md

      - name: Commit and push bumped version and changelogs
        run: |
          if ! git diff --quiet farm-waitlist/config.yaml CHANGELOG.md farm-waitlist/CHANGELOG.md UNRELEASED.md package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add farm-waitlist/config.yaml CHANGELOG.md farm-waitlist/CHANGELOG.md UNRELEASED.md package.json
            git commit -m "chore(release): v${{ steps.version.outputs.value }} [skip ci]"
            git push
          fi

      - name: Create GitHub Release tag if new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            if [ -s /tmp/release-notes.md ]; then
              gh release create "${TAG}" --title "Farm Waitlist ${TAG}" --notes-file /tmp/release-notes.md
            else
              gh release create "${TAG}" --title "Farm Waitlist ${TAG}" --generate-notes
            fi
          fi
